name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL }} # Get the URL from GitHub secrets
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22 # Recommended stable LTS for GitHub Actions & Playwright

    - name: Corepack Enable & Install Dependencies
      run: |
        corepack enable
        yarn install --frozen-lockfile

    - name: Install Playwright Browsers with System Dependencies
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: yarn playwright test

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30